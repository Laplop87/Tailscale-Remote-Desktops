name: Pure Ubuntu VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  ubuntu-vnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install XFCE, TigerVNC, and configure VNC user
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common

          # Create dedicated VNC user
          sudo useradd -m -s /bin/bash vncuser
          echo "vncuser:vnc2025" | sudo chpasswd
          sudo adduser vncuser sudo

          # Pre-create BOTH legacy and XDG directories as vncuser
          sudo -H -u vncuser mkdir -p /home/vncuser/.vnc
          sudo -H -u vncuser mkdir -p /home/vncuser/.config/tigervnc

          # VNC password (max 8 chars)
          echo "vnc2025" | sudo -H -u vncuser bash -c 'vncpasswd -f > /home/vncuser/.vnc/passwd'
          sudo chmod 600 /home/vncuser/.vnc/passwd
          sudo chown vncuser:vncuser /home/vncuser/.vnc/passwd

          # Also place password in the XDG path directly (skips migration)
          sudo cp /home/vncuser/.vnc/passwd /home/vncuser/.config/tigervnc/passwd
          sudo chown -R vncuser:vncuser /home/vncuser/.config

          # xstartup (legacy path is still read)
          sudo tee /home/vncuser/.vnc/xstartup > /dev/null << 'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          sudo chmod +x /home/vncuser/.vnc/xstartup
          sudo chown vncuser:vncuser /home/vncuser/.vnc/xstartup

      - name: Start VNC Server
        run: |
          # Force HOME and XDG_CONFIG_HOME explicitly for the vncserver process
          sudo -u vncuser env \
            HOME=/home/vncuser \
            XDG_CONFIG_HOME=/home/vncuser/.config \
            vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
          sleep 5
          echo "--- VNC server list ---"
          sudo -u vncuser env HOME=/home/vncuser vncserver -list

      - name: Display Connection Details
        run: |
          echo "================ VNC IS READY ================"
          echo "IP Address : $(tailscale ip -4)"
          echo "Port       : 5901"
          echo "Password   : vnc2025"
          echo "=============================================="

      - name: Keep Alive
        run: sleep 21600
