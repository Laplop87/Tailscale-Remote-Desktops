name: Pure Ubuntu VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  ubuntu-vnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install XFCE, TigerVNC, and configure VNC user
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common

          # Create dedicated VNC user
          sudo useradd -m -s /bin/bash vncuser
          echo "vncuser:vnc2025" | sudo chpasswd
          sudo adduser vncuser sudo

          # Create .vnc directory AS vncuser (this was the "Permission denied")
          sudo -u vncuser mkdir -p /home/vncuser/.vnc

          # VNC password (max 8 chars — TigerVNC truncates silently beyond this)
          echo "vnc2025" | sudo -u vncuser bash -c 'vncpasswd -f > /home/vncuser/.vnc/passwd'
          sudo chmod 600 /home/vncuser/.vnc/passwd
          sudo chown vncuser:vncuser /home/vncuser/.vnc/passwd

          # xstartup that launches XFCE cleanly
          sudo tee /home/vncuser/.vnc/xstartup > /dev/null << 'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          sudo chmod +x /home/vncuser/.vnc/xstartup
          sudo chown vncuser:vncuser /home/vncuser/.vnc/xstartup

      - name: Start VNC Server
        run: |
          sudo -u vncuser vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
          sleep 5
          echo "--- VNC server list ---"
          sudo -u vncuser vncserver -list

      - name: Display Connection Details
        run: |
          echo "================ VNC IS READY ================"
          echo "IP Address : $(tailscale ip -4)"
          echo "Port       : 5901"
          echo "Password   : vnc2025"
          echo "Note: VNC passwords are limited to 8 characters"
          echo "=============================================="

      - name: Keep Alive
        run: sleep 21600
