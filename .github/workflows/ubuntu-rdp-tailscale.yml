name: Pure Ubuntu VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  ubuntu-vnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install XFCE, TigerVNC, and configure VNC user
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common

          # Create dedicated VNC user
          sudo useradd -m -s /bin/bash vncuser
          echo "vncuser:vnc2025" | sudo chpasswd
          sudo adduser vncuser sudo

          # Do NOT create ~/.vnc – prevents the migration script from firing.
          # Create the modern XDG path instead.
          sudo -H -u vncuser mkdir -p /home/vncuser/.config/tigervnc

          # VNC password (max 8 chars) – write directly to XDG path
          echo "vnc2025" | sudo -H -u vncuser bash -c 'vncpasswd -f > /home/vncuser/.config/tigervnc/passwd'
          sudo chmod 600 /home/vncuser/.config/tigervnc/passwd
          sudo chown vncuser:vncuser /home/vncuser/.config/tigervnc/passwd

          # xstartup – also in XDG path
          sudo tee /home/vncuser/.config/tigervnc/xstartup > /dev/null << 'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          sudo chmod +x /home/vncuser/.config/tigervnc/xstartup
          sudo chown vncuser:vncuser /home/vncuser/.config/tigervnc/xstartup

      - name: Start VNC Server
        run: |
          # Run as vncuser in a shell that explicitly sets HOME and XDG_CONFIG_HOME
          sudo -u vncuser bash -c '
            export HOME=/home/vncuser
            export XDG_CONFIG_HOME=/home/vncuser/.config
            vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
          '
          sleep 5
          echo "--- VNC server list ---"
          sudo -u vncuser bash -c '
            export HOME=/home/vncuser
            export XDG_CONFIG_HOME=/home/vncuser/.config
            vncserver -list
          '

      - name: Display Connection Details
        run: |
          echo "================ VNC IS READY ================"
          echo "IP Address : $(tailscale ip -4)"
          echo "Port       : 5901"
          echo "Password   : vnc2025"
          echo "=============================================="

      - name: Keep Alive
        run: sleep 21600
