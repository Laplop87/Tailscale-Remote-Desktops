name: Pure Ubuntu VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  ubuntu-vnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install XFCE, TigerVNC, and configure VNC user
        run: |
          sudo apt-get update
          # Install XFCE desktop and the TigerVNC server
          sudo apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common

          # Create a dedicated user for the VNC session
          sudo useradd -m -s /bin/bash vncuser
          echo "vncuser:UbuntuVNC2025" | sudo chpasswd
          sudo adduser vncuser sudo

          # Set up the VNC password (must be 6-8 characters)
          mkdir -p /home/vncuser/.vnc
          echo "UbuntuVNC2025" | vncpasswd -f > /home/vncuser/.vnc/passwd
          chmod 600 /home/vncuser/.vnc/passwd
          chown -R vncuser:vncuser /home/vncuser/.vnc

          # Create the xstartup script to launch XFCE
          cat > /home/vncuser/.vnc/xstartup << 'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x /home/vncuser/.vnc/xstartup
          chown vncuser:vncuser /home/vncuser/.vnc/xstartup

      - name: Start VNC Server
        run: |
          # Start TigerVNC on display :1 (which listens on port 5901)
          # Use -localhost no to allow connections from the Tailscale network
          sudo -u vncuser vncserver :1 -geometry 1920x1080 -depth 24 -localhost no

      - name: Display Connection Details
        run: |
          echo "================ VNC IS READY ================"
          echo "IP Address: $(tailscale ip -4)"
          echo "Port      : 5901"
          echo "Password  : UbuntuVNC2025"
          echo "=============================================="

      - name: Keep Alive
        run: sleep 21600
