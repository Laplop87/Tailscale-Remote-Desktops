name: Pure Ubuntu VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  ubuntu-vnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install XFCE, TigerVNC, dbus-x11, and configure VNC user
        run: |
          sudo apt-get update
          # dbus-x11 provides dbus-launch, which is essential for XFCE under VNC
          sudo apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common dbus-x11

          # Create dedicated VNC user
          sudo useradd -m -s /bin/bash vncuser
          echo "vncuser:vnc2025" | sudo chpasswd
          sudo adduser vncuser sudo

          # Pre-create the config directory (migration target)
          sudo -H -u vncuser mkdir -p /home/vncuser/.config/tigervnc

          # VNC password (max 8 chars)
          echo "vnc2025" | sudo -H -u vncuser bash -c 'vncpasswd -f > /home/vncuser/.config/tigervnc/passwd'
          sudo chmod 600 /home/vncuser/.config/tigervnc/passwd
          sudo chown vncuser:vncuser /home/vncuser/.config/tigervnc/passwd

          # Create ~/.vnc/xstartup (traditional path TigerVNC reads first)
          sudo -H -u vncuser mkdir -p /home/vncuser/.vnc
          sudo tee /home/vncuser/.vnc/xstartup > /dev/null << 'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          # Set runtime dir for dbus/pulseaudio
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          [ -d "$XDG_RUNTIME_DIR" ] || install -d -m 700 "$XDG_RUNTIME_DIR"
          # Launch XFCE within a proper dbus session
          exec dbus-launch --exit-with-session startxfce4
          EOF
          sudo chmod +x /home/vncuser/.vnc/xstartup
          sudo chown vncuser:vncuser /home/vncuser/.vnc/xstartup

      - name: Start VNC Server
        run: |
          sudo -u vncuser bash -c '
            export HOME=/home/vncuser
            export XDG_CONFIG_HOME=/home/vncuser/.config
            vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
          '
          sleep 5
          echo "--- VNC server list ---"
          sudo -u vncuser bash -c '
            export HOME=/home/vncuser
            export XDG_CONFIG_HOME=/home/vncuser/.config
            vncserver -list
          '

      - name: Diagnose VNC Session (optional)
        run: |
          echo "--- xstartup content ---"
          cat /home/vncuser/.vnc/xstartup
          echo "--- VNC log (first 50 lines) ---"
          sudo tail -n 50 /home/vncuser/.vnc/*.log 2>/dev/null || echo "No log found"

      - name: Display Connection Details
        run: |
          echo "================ VNC IS READY ================"
          echo "IP Address : $(tailscale ip -4)"
          echo "Port       : 5901"
          echo "Password   : vnc2025"
          echo "=============================================="

      - name: Keep Alive
        run: sleep 21600
