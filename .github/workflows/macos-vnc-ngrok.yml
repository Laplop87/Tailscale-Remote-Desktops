name: macOS VNC via ngrok

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VNC Server and User
        run: |
          # Disable Spotlight indexing to reduce resource usage
          sudo mdutil -i off -a

          # Create a dedicated VNC user account
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/bash
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 1001
          sudo dscl . -create /Users/vncuser PrimaryGroupID 80
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          
          # Set the password for the vncuser account
          sudo dscl . -passwd /Users/vncuser ${{ secrets.VNC_USER_PASSWORD }}
          sudo createhomedir -c -u vncuser > /dev/null

          # Enable VNC (Screen Sharing) for all users
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          
          # Set the VNC-only legacy password
          # This is required for some VNC clients
          echo ${{ secrets.VNC_PASSWORD }} | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; 
            $_ = <>; chomp; s/^(.{8}).*/$1/; 
            @p = unpack "C*", $_; 
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; 
            print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt

          # Restart and activate the ARD agent to apply settings
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate

      - name: Install and Start ngrok
        run: |
          brew install ngrok/ngrok/ngrok
          ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
          # Start the TCP tunnel on port 5900 in the background
          ngrok tcp 5900 --log=stdout > ngrok.log &
          
          # Wait for the tunnel to be established
          sleep 10
          
          echo "================ VNC IS READY ================"
          echo "Connection details from ngrok:"
          grep -o 'tcp://[^ ]*' ngrok.log | head -1
          echo "Use the address above with your VNC viewer."
          echo "=============================================="

      - name: Prevent Display Sleep (Anti-Black Screen)
        run: |
          # Keep the virtual display awake for the duration of the session
          caffeinate -d &
          sleep 21600
