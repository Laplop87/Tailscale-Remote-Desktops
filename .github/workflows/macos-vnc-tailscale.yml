name: macOS VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Configure VNC and set runner password
        run: |
          # Enable Screen Sharing (VNC)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all

          # Give runner remote control privileges explicitly
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -users runner -access -on -privs -all

          # Set a KNOWN password for the runner user (console owner)
          sudo dscl . -passwd /Users/runner "VncMac2025"

          # Verify Screen Sharing is listening
          sudo lsof -iTCP:5900 -sTCP:LISTEN || true

          echo "================ VNC IS READY ================"
          echo "IP Address : $(tailscale ip -4)"
          echo "Port       : 5900"
          echo "Username   : runner"
          echo "Password   : VncMac2025"
          echo "=============================================="
          echo ""
          echo "⚠️ If you get a black screen, that's the headless-runner TCC issue."

      - name: Keep Alive
        run: sleep 21600
