name: macOS VNC via Tailscale (Runner Auth)

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Configure VNC Server and Display Connection Details
        run: |
          # Enable Screen Sharing (VNC)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all

          # Decode the auto-login password for the 'runner' user
          # The password is XORed with a fixed 11-byte key in /etc/kcpassword
          RUNNER_PASS=$(sudo perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }; 
            open(my $fh, "<", "/etc/kcpassword") or die "Cannot open kcpassword: $!";
            binmode($fh);
            local $/; my $data = <$fh>; close($fh);
            my @p = unpack("C*", $data);
            foreach (@p) { last if $_ == 0; printf "%c", $_ ^ (shift @k || 0); }
          ')
          
          echo "================ VNC IS READY ================"
          echo "IP Address : $(tailscale ip -4)"
          echo "Port       : 5900"
          echo "Username   : runner"
          echo "Password   : $RUNNER_PASS"
          echo "=============================================="
          echo ""
          echo "⚠️ The screen may be black due to the headless runner. Input will still work."

      - name: Keep Alive
        run: sleep 21600
