name: macOS VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Configure VNC Server and User
        run: |
          # Disable Spotlight indexing to reduce resource usage
          sudo mdutil -i off -a

          # Create a dedicated VNC user account
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/bash
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 1001
          sudo dscl . -create /Users/vncuser PrimaryGroupID 80
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser ${{ secrets.VNC_USER_PASSWORD }}
          sudo createhomedir -c -u vncuser > /dev/null

          # Enable Screen Sharing (VNC) for all users
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all

          # Set the legacy VNC-only password (for RealVNC Viewer when it asks only for a password)
          echo ${{ secrets.VNC_PASSWORD }} | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; 
            $_ = <>; chomp; s/^(.{8}).*/$1/; 
            @p = unpack "C*", $_; 
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; 
            print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt

      - name: Verify VNC is listening
        run: |
          # macOS Screen Sharing listens on port 5900
          sudo lsof -iTCP:5900 -sTCP:LISTEN || echo "VNC not listening yet — ARD may need a moment"

      - name: Display Connection Details
        run: |
          echo "================ VNC IS READY ================"
          echo "IP Address : $(tailscale ip -4)"
          echo "Port       : 5900"
          echo "Username   : vncuser (or leave blank if only password is asked)"
          echo "Password   : use VNC_USER_PASSWORD or VNC_PASSWORD secret"
          echo "=============================================="

      - name: Prevent Display Sleep (Anti-Black Screen)
        run: |
          # Keep the virtual display awake for the duration of the session
          caffeinate -d &
          sleep 21600
